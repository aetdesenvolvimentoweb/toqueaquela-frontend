name = "toqueaquela-frontend"
compatibility_date = "2025-05-01"
pages_build_output_dir = ".svelte-kit/cloudflare"

# Variavel publica (acessivel ao bundle do client via import.meta.env.PUBLIC_API_URL)
# Para producao, configurar no dashboard Pages → Settings → Environment variables:
#   PUBLIC_API_URL = https://toqueaquela-backend.<seu-subdominio>.workers.dev
[vars]
PUBLIC_API_URL = "http://localhost:3000,https://toqueaquela-backend.aetdesenvolvimentoweb.workers.dev"
